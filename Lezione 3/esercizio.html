<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
 
<body>
    <div class="dashboard">
        <h1>Computer Lab Dashboard</h1>
        <h2>Lab 1 - Equipement</h2>
        <div class="carte">
            <div class="carta" id="carta1">
                <h2>Total Pcs</h2>
                <h1>20</h1>
            </div>
            <div class="carta" id="carta2">
                <h2>Available Pcs</h2>
                <h1>18</h1>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Equipement Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Desktop Pcs</td>
                    <td class="si">Available</td>
 
                </tr>
                <tr>
                    <td>Printer</td>
                    <td class="no">Mantainance</td>
 
                </tr>
                <tr>
                    <td>projector</td>
                    <td class="si">Available</td>
 
                </tr>
            </tbody>
 
        </table>
 
 
    </div>
 
</body>
 
</html>
