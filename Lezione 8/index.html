<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iscrizione evento</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="script.js">
</head>
<body>
    <div class="blu">
        <h1 class="iscrizione">Iscrizione a un evento</h1>

        <div class="bianco">
            <form id="modulo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">

                <label for="eta">Età:</label>
                <input type="number" id="eta" name="eta">

                <label for="corso">Scegli un corso:</label>
                <select id="corso" name="corso">
                    <option>JavaScript</option>
                    <option>HTML</option>
                    <option>CSS</option>
                </select>

                <h2>Modalità di partecipazione:</h2>
                <div class="riga">
                    <input type="radio" id="presenza" name="modalita" value="In presenza">
                    <label for="presenza">In presenza</label>

                    <input type="radio" id="online" name="modalita" value="Online">
                    <label for="online">Online</label>
                </div>

                <h2>Attività aggiuntive:</h2>
                <div class="riga">
                    <input type="checkbox" id="laboratorio" name="attivita" value="Laboratorio pratico">
                    <label for="laboratorio">Laboratorio pratico</label>
                </div>
                <div class="riga">
                    <input type="checkbox" id="workshop" name="attivita" value="Workshop">
                    <label for="workshop">Workshop</label>
                </div>

                <label for="note">Note:</label>
                <textarea id="note" name="note"></textarea>

                <button type="submit">Invia</button>
            </form>
        </div>

        <hr>

        <h2 class="titolo-riepilogo">Riepilogo iscrizione</h2>
        <div class="bianco" id="riepilogo"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
